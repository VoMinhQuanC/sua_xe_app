name: suaxe_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter   
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.2
  get: ^4.6.6
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  carousel_slider: ^4.2.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.1.6
  firebase_auth: ^5.3.4
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  font_awesome_flutter: ^10.6.0
  intl: ^0.20.2
  socket_io_client: ^3.1.3
  qr_flutter: ^4.1.0
  image_picker: ^1.2.1
  gal: ^2.3.2
  permission_handler: ^11.0.1
  dio: ^5.4.0
  
  # ✅ THÊM MỚI CHO ATTENDANCE MODULE
  mobile_scanner: ^7.1.4   # QR code scanning
  geolocator: ^10.1.0        # GPS location tracking

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo1.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/logo1.png"
  
flutter:
  uses-material-design: true
  assets:
    - assets/images/