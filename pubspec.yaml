name: suaxe_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  get: ^4.6.6
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  carousel_slider: ^4.2.1
  http: ^1.1.0
  dio: ^5.3.3
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.1.6
  firebase_auth: ^4.15.0
  firebase_core: ^2.24.0
  font_awesome_flutter: ^10.6.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo1.png"
  # Tùy chọn thêm:
  adaptive_icon_background: "#FFFFFF"  # Màu nền cho Android adaptive icon
  adaptive_icon_foreground: "assets/icon/logo1.png"
  
flutter:
  uses-material-design: true
  assets:
    - assets/images/
